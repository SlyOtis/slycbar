<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #ffe81f; cursor: none; -webkit-user-select: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
#intro { position: fixed; inset: 0; display: grid; place-items: center; opacity: 0; font: 500 3.2vw/1.3 "Helvetica Neue", Helvetica, sans-serif; color: #4bd5ee; transition: opacity 2s; }
#intro.on { opacity: 1; }
#scene { position: fixed; inset: 0; perspective: 38vh; perspective-origin: 50% 25%; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 100%); }
#crawl { position: absolute; left: 50%; top: 100%; width: 76vw; margin-left: -38vw; transform-origin: 50% 0; transform: rotateX(25deg); font: 700 3.1vw/1.35 "Helvetica Neue", Helvetica, sans-serif; text-align: center; overflow-wrap: anywhere; will-change: transform; }
#crawl .episode { margin: 0; padding-top: 6vh; font: 600 2.6vw/1 "Helvetica Neue", Helvetica, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; text-align: center; text-align-last: center; }
#crawl h2 { margin: 1.2vh 0 5vh; font: 700 7vw/1 "Helvetica Neue", Helvetica, sans-serif; letter-spacing: 0.02em; text-transform: uppercase; text-align: center; text-align-last: center; }
#crawl p { margin: 0 0 2.2vh; }
#crawl p.user { font-weight: 700; }
#crawl p.assistant { font-weight: 400; }
#end { position: fixed; inset: 0; display: grid; place-items: center; opacity: 0; font: 900 9vw/1 Impact, "Arial Black", sans-serif; letter-spacing: 0.12em; text-transform: uppercase; -webkit-text-stroke: 2px #000; transform: scaleY(1.3); transition: opacity 3s; }
#end.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="intro">Just a short time ago,<br>in the terminal right here....</div>
<div id="scene"><div id="crawl"></div></div>
<div id="end">To be continued…</div>
<audio id="song"></audio>
<script>
var WARP = 6800, INTRO_IN = 8400, INTRO_OUT = 11800, CRAWL = 12600;
var step = 4, mosaic = document.createElement("canvas"), stage;
var canvas = document.getElementById('stars');
var ctx = canvas.getContext('2d');
var crawl = document.getElementById('crawl');
var song = document.getElementById('song');
var dpr = devicePixelRatio || 1;
var w, h, desk, nebula, layer, particles = [], twinklers = [], phase = 'wait';
var born = 0, crawlAt = 0, seconds = 60, distance = 0, done = false, ended = false;

function post(body) {
	window.webkit.messageHandlers.tray.postMessage(body);
}

function log(line) {
	try { post({ log: 'warp ' + line }); } catch (e) {}
}

function close() {
	if (done) return;
	done = true;
	song.pause();
	log('closed');
	post({ close: true });
}

function size() {
	w = canvas.width = Math.round(innerWidth * dpr);
	h = canvas.height = Math.round(innerHeight * dpr);
	paintNebula();
}

function offscreen() {
	var c = document.createElement('canvas');
	c.width = w; c.height = h;
	return c;
}

function paintNebula() {
	nebula = offscreen();
	var n = nebula.getContext('2d');
	var tints = ['70,90,190', '140,70,170', '40,120,150', '90,60,140', '30,80,160'];
	for (var i = 0; i < 6; i++) {
		var x = Math.random() * w, y = Math.random() * h, r = Math.max(w, h) * (0.25 + Math.random() * 0.4);
		var g = n.createRadialGradient(x, y, 0, x, y, r);
		g.addColorStop(0, 'rgba(' + tints[i % tints.length] + ',0.11)');
		g.addColorStop(0.5, 'rgba(' + tints[i % tints.length] + ',0.04)');
		g.addColorStop(1, 'rgba(0,0,0,0)');
		n.fillStyle = g;
		n.fillRect(0, 0, w, h);
	}
}

function starColor() {
	var r = Math.random();
	if (r < 0.58) return [255, 255, 255];
	if (r < 0.8) return [198, 214, 255];
	if (r < 0.95) return [255, 238, 205];
	return [255, 200, 150];
}

function shrink(image, block) {
	mosaic.width = Math.ceil(w / block);
	mosaic.height = Math.ceil(h / block);
	mosaic.getContext('2d').drawImage(image, 0, 0, w / block, h / block);
}

function seedFrom(image) {
	step = Math.max(4, Math.round(Math.sqrt(w * h / 42000)));
	var pixels = null, cols = Math.ceil(w / step);
	stage = offscreen();
	if (image) {
		shrink(image, step);
		pixels = mosaic.getContext('2d').getImageData(0, 0, mosaic.width, mosaic.height).data;
	}
	particles = [];
	var cx = w / 2, cy = h / 2, far = Math.hypot(cx, cy);
	for (var y = step / 2; y < h; y += step) {
		for (var x = step / 2; x < w; x += step) {
			var i = (Math.floor(y / step) * cols + Math.floor(x / step)) * 4;
			var c = starColor(), z = 0.15 + Math.random() * 0.85, bright = Math.random() < 0.01;
			particles.push({
				x: x, y: y,
				r: pixels ? pixels[i] : 0, g: pixels ? pixels[i + 1] : 0, b: pixels ? pixels[i + 2] : 0,
				tx: Math.random() * w, ty: Math.random() * h, z: z,
				ts: (bright ? 1.3 + Math.random() * 0.9 : 0.25 + (1 - z) * 0.85) * dpr,
				tr: c[0], tg: c[1], tb: c[2],
				ta: bright ? 1 : 0.35 + (1 - z) * 0.6,
				bright: bright,
				d: 0.05 + Math.min(0.4, Math.hypot(x - cx, y - cy) / far * 0.25 + Math.random() * 0.2),
				ph: Math.random() * Math.PI * 2, f: 0.6 + Math.random() * 2.2,
				s0: step
			});
		}
	}
}

function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

function dissolve(t) {
	ctx.fillStyle = '#000';
	ctx.fillRect(0, 0, w, h);
	ctx.globalAlpha = Math.max(0, Math.min(1, (t - 0.3) / 0.7));
	ctx.drawImage(nebula, 0, 0);
	ctx.globalAlpha = 1;
	var moving = [], whole = true;
	for (var i = 0; i < particles.length; i++) {
		var p = particles[i];
		p.e = ease(Math.max(0, Math.min(1, (t - p.d) / (1 - p.d))));
		if (p.e > 0) moving.push(p); else whole = false;
	}
	if (desk && !whole) {
		var block = 1 + (step - 1) * ease(Math.min(1, t / 0.3));
		shrink(desk, block);
		var s = stage.getContext('2d');
		s.globalCompositeOperation = 'copy';
		s.imageSmoothingEnabled = false;
		s.drawImage(mosaic, 0, 0, mosaic.width * block, mosaic.height * block);
		s.globalCompositeOperation = 'destination-out';
		s.beginPath();
		for (var j = 0; j < moving.length; j++) s.rect(moving[j].x - step / 2, moving[j].y - step / 2, step, step);
		s.fill();
		ctx.drawImage(stage, 0, 0);
	}
	for (var i = 0; i < moving.length; i++) {
		var p = moving[i], e = p.e;
		var x = p.x + (p.tx - p.x) * e, y = p.y + (p.ty - p.y) * e;
		var s = p.s0 + (p.ts - p.s0) * e;
		var r = Math.round(p.r + (p.tr - p.r) * e), g = Math.round(p.g + (p.tg - p.g) * e), b = Math.round(p.b + (p.tb - p.b) * e);
		var a = 1 + ((p.bright ? 1 : p.ta * 0.7) - 1) * e;
		ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + a.toFixed(2) + ')';
		ctx.fillRect(x - s / 2, y - s / 2, s, s);
	}
}

function settle() {
	layer = offscreen();
	var l = layer.getContext('2d');
	l.drawImage(nebula, 0, 0);
	twinklers = [];
	for (var i = 0; i < particles.length; i++) {
		var p = particles[i];
		p.x = p.tx; p.y = p.ty;
		if (p.bright) {
			var g = l.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.ts * 3);
			g.addColorStop(0, 'rgba(' + p.tr + ',' + p.tg + ',' + p.tb + ',0.8)');
			g.addColorStop(0.35, 'rgba(' + p.tr + ',' + p.tg + ',' + p.tb + ',0.18)');
			g.addColorStop(1, 'rgba(' + p.tr + ',' + p.tg + ',' + p.tb + ',0)');
			l.fillStyle = g;
			l.fillRect(p.x - p.ts * 3, p.y - p.ts * 3, p.ts * 6, p.ts * 6);
		}
		l.fillStyle = 'rgba(' + p.tr + ',' + p.tg + ',' + p.tb + ',' + (p.bright ? 1 : p.ta * 0.7).toFixed(2) + ')';
		l.fillRect(p.x - p.ts / 2, p.y - p.ts / 2, p.ts, p.ts);
		if (p.bright || Math.random() < 0.035) twinklers.push(p);
	}
	particles = [];
}

function sky(now) {
	var zoom = 1 + (now - born - WARP) / 1000 * 0.0012;
	var cx = w / 2, cy = h / 2;
	ctx.fillStyle = '#000';
	ctx.fillRect(0, 0, w, h);
	ctx.save();
	ctx.translate(cx, cy);
	ctx.scale(zoom, zoom);
	ctx.translate(-cx, -cy);
	ctx.drawImage(layer, 0, 0);
	var t = now / 1000;
	for (var i = 0; i < twinklers.length; i++) {
		var p = twinklers[i];
		var wave = Math.sin(t * p.f + p.ph);
		var flash = p.bright ? 0.5 + 0.5 * wave : Math.pow(Math.max(0, wave), 12);
		var a = p.bright ? 0.5 + 0.5 * flash : 0.2 + 0.8 * flash;
		ctx.fillStyle = 'rgba(' + p.tr + ',' + p.tg + ',' + p.tb + ',' + (a * p.ta).toFixed(2) + ')';
		var s = p.ts * (p.bright ? 1.3 : 1 + flash * 1.4);
		ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
	}
	ctx.restore();
}

function roman(n) {
	var map = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']], out = '';
	map.forEach(function (m) { while (n >= m[0]) { out += m[1]; n -= m[0]; } });
	return out;
}

function esc(s) {
	return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
}

function fill(data) {
	crawl.innerHTML = data.projects.map(function (p, i) {
		return '<p class="episode">Episode ' + roman(i + 1) + '</p><h2>' + esc(p.title) + '</h2>' +
			p.lines.map(function (l) { return '<p class="' + l.role + '">' + esc(l.text) + '</p>'; }).join('');
	}).join('') || '<p class="episode">Episode I</p><h2>Nothing yet</h2>';
	seconds = Math.max(20, data.estimate || 0);
	measure();
	log('crawl ' + data.projects.length + ' projects, ' + seconds + 's, ' + Math.round(distance) + 'px');
}

function measure() {
	distance = innerHeight + crawl.offsetHeight * 1.15;
}

function frame(now) {
	if (phase === 'warp') {
		var t = (now - born) / WARP;
		if (t >= 1) { settle(); phase = 'stars'; } else dissolve(t);
	} else if (phase === 'stars') {
		sky(now);
	}
	if (phase !== 'wait') {
		var since = now - born;
		var intro = document.getElementById('intro');
		if (since > INTRO_IN && since < INTRO_OUT) intro.classList.add('on'); else intro.classList.remove('on');
		if (since >= CRAWL && !crawlAt) {
			crawlAt = now;
			crawl.style.visibility = 'visible';
			if (song.src) song.play().catch(function (e) { log('song ' + e); song.removeAttribute('src'); });
		}
		if (crawlAt) {
			var p = song.src && song.duration ? Math.min(1, song.currentTime / song.duration) : Math.min(1, (now - crawlAt) / 1000 / seconds);
			crawl.style.transform = 'rotateX(25deg) translate3d(0, ' + (-distance * p) + 'px, 0)';
			if (p >= 1 && !ended) {
				ended = true;
				document.getElementById('end').classList.add('on');
				log('ended');
				setTimeout(close, 6000);
			}
		}
	}
	requestAnimationFrame(frame);
}

function begin(data) {
	fill(data);
	crawl.style.visibility = 'hidden';
	if (data.audio) {
		song.src = 'file://' + data.audio;
		song.addEventListener('error', function () { log('audio failed'); song.removeAttribute('src'); });
		song.load();
	}
	var go = function (image) {
		desk = image;
		seedFrom(image);
		if (image) ctx.drawImage(image, 0, 0, w, h);
		requestAnimationFrame(function () {
			requestAnimationFrame(function (now) {
				post({ ready: true });
				born = now;
				phase = 'warp';
				log('dissolve ' + particles.length + ' specks' + (image ? '' : ', no desktop'));
			});
		});
	};
	if (data.desktop) {
		var img = new Image();
		img.onload = function () { go(img); };
		img.onerror = function () { log('desktop failed'); go(null); };
		img.src = 'file://' + data.desktop + '?t=' + Date.now();
	} else {
		go(null);
	}
}

window.onerror = function (m, s, l) { log(m + ' line ' + l); };
size();
addEventListener('resize', function () { size(); measure(); });
addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
addEventListener('mousedown', close);
requestAnimationFrame(frame);

var xhr = new XMLHttpRequest();
xhr.open('GET', 'file://' + new URLSearchParams(location.search).get('data') + '?t=' + Date.now());
xhr.onload = function () {
	var data;
	try { data = JSON.parse(xhr.responseText); } catch (e) { log('data ' + e); data = { projects: [], audio: '', desktop: '', estimate: 0 }; }
	begin(data);
};
xhr.onerror = function () { log('data unreadable'); begin({ projects: [], audio: '', desktop: '', estimate: 0 }); };
xhr.send();
</script>
</body>
</html>
