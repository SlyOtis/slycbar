<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #e8f1f5; -webkit-user-select: none; font: 400 1vw/1.4 "Helvetica Neue", Helvetica, sans-serif; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
.hud { opacity: 0; transition: opacity 2.5s; text-shadow: 0 0.1vw 0.7vw rgba(0, 0, 0, 0.85); pointer-events: none; }
.hud.on { opacity: 1; }
.crit { position: fixed; max-width: 34vw; transform: translate(-50%, -50%); text-align: center; pointer-events: none; font: 900 2.5vw/1.05 Impact, "Arial Black", sans-serif; letter-spacing: 0.02em; color: #ffd100; -webkit-text-stroke: 0.06em #000; paint-order: stroke fill; text-shadow: 0 0.09em 0 #000; animation: crit 3.6s ease-out forwards; }
.crit small { display: block; font: 700 0.34em/1.5 "Helvetica Neue", Helvetica, sans-serif; letter-spacing: 0; color: #fff; -webkit-text-stroke: 0; text-shadow: 0 0.1vw 0.3vw #000; }
.crit.hit { color: #ff3b30; }
.crit.miss { color: #ffffff; }
@keyframes crit { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--tilt)) scale(0.3); } 8% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--tilt)) scale(1.7); } 16% { transform: translate(-50%, -50%) rotate(var(--tilt)) scale(1); } 72% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -190%) rotate(var(--tilt)) scale(0.9); } }
#note { position: fixed; left: 3vw; right: 30vw; top: 1.6vh; font-size: 0.62vw; color: rgba(232, 241, 245, 0.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#say { position: fixed; max-width: 20vw; padding: 0.9vw 1.2vw; border-radius: 1.4vw 1.4vw 0.2vw 1.4vw; background: #fff; color: #10151c; font: 700 1.25vw/1.25 "Helvetica Neue", Helvetica, sans-serif; opacity: 0; transform: translate(-100%, 0) scale(0.7); transform-origin: 100% 100%; transition: opacity 0.25s, transform 0.25s cubic-bezier(0.2, 1.6, 0.4, 1); pointer-events: none; box-shadow: 0 0.6vw 2vw rgba(0, 0, 0, 0.45); }
#say.on { opacity: 1; transform: translate(-100%, 0) scale(1); }
#say.muffled { font-style: italic; font-size: 1vw; color: #5b6470; background: #e6e9ee; }
#goo { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none; }
body.flying #say, body.flying #hail, body.flying #note, body.flying .crit { display: none; }
#hail { position: fixed; max-width: 20vw; padding: 0.7vw 1vw; border-radius: 1.2vw 1.2vw 1.2vw 0.2vw; background: #fff; color: #10151c; font: 700 1.05vw/1.25 "Helvetica Neue", Helvetica, sans-serif; opacity: 0; transform: translate(-6%, -100%) scale(0.7); transform-origin: 0 100%; transition: opacity 0.25s, transform 0.25s cubic-bezier(0.2, 1.6, 0.4, 1); pointer-events: none; box-shadow: 0 0.6vw 2vw rgba(0, 0, 0, 0.45); }
#hail.on { opacity: 1; transform: translate(-6%, -100%) scale(1); }
body.landed > *:not(#stage):not(#whiteout) { display: none !important; }
</style>
</head>

<script src="three.min.js"></script>

<script>

var WAVE = 5200, R = 1.5, MOUTH = -0.62, BEAT = 2, CUT = 9, FRONT = 10.2, FLOOR = 0, TOP = 5.6, RULER = 6.2, WORLD = 8200000000, full = 0;
var MUFFLED = ['Mmmph!', 'Mmmf mm mmph!', 'Hhnnngh…', 'Mm-mm! Mm-mm!', 'Mmmmmmmm!'];
var LINES = ['Oh no!', 'Please, no more. I cannot take it.', 'Another prompt? Really?', 'I felt that one.', 'That was a glacier, you know.', 'You could have just read the docs.', 'I am not angry. I am disappointed.', 'My oceans are not a cooling loop.', 'Is it getting warm in here?', 'Stop. Think of the fish.', 'One more token and I start melting.', 'I used to have ice up here.'];

var done = false, born = 0, first = null, party = false, glow = 0, gagged = false;
var level = { at: [0, 0, 0, 0, 0, 0], goal: [0, 0, 0, 0, 0, 0], highAt: 0 }, litres = { min: 0, max: 0 };
var mouse = { x: 0.2, y: 0.6 }, saidAt = 0, sayNext = 9000, said = -1, talking = 0;
var song = document.getElementById('song');

function post(body) {
	window.webkit.messageHandlers.tray.postMessage(body);
}

function log(line) {
	try { post({ log: 'impact ' + line }); } catch (e) {}
}

function close() {
	if (done) return;
	done = true;
	if (reel) reel.pause();
	song.pause();
	sea.pause();
	log('closed');
	post({ close: true });
}

function count(n, digits) {
	return n.toLocaleString('en-US', { maximumFractionDigits: digits || 0 });
}

function ease(t) {
	t = Math.max(0, Math.min(1, t));
	return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function put(id, text) {
	var field = fields[id];
	if (field) {
		if (field[0][field[1]] !== text) {
			field[0][field[1]] = text;
			paint(field[0]);
		}
		return;
	}
	document.getElementById(id).textContent = text;
}

function hash(x, y, z) {
	var n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
	return n - Math.floor(n);
}

function noise(x, y, z) {
	var ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
	var fx = x - ix, fy = y - iy, fz = z - iz;
	fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
	function mix(a, b, t) { return a + (b - a) * t; }
	return mix(
		mix(mix(hash(ix, iy, iz), hash(ix + 1, iy, iz), fx), mix(hash(ix, iy + 1, iz), hash(ix + 1, iy + 1, iz), fx), fy),
		mix(mix(hash(ix, iy, iz + 1), hash(ix + 1, iy, iz + 1), fx), mix(hash(ix, iy + 1, iz + 1), hash(ix + 1, iy + 1, iz + 1), fx), fy), fz);
}

function fbm(x, y, z, octaves) {
	var sum = 0, amp = 0.5, total = 0;
	for (var i = 0; i < octaves; i++) {
		sum += noise(x, y, z) * amp;
		total += amp;
		x *= 2.03; y *= 2.03; z *= 2.03;
		amp *= 0.5;
	}
	return sum / total;
}

function globe(wide, tall, paint) {
	var canvas = document.createElement('canvas');
	canvas.width = wide;
	canvas.height = tall;
	var c = canvas.getContext('2d'), image = c.createImageData(wide, tall), d = image.data;
	for (var py = 0; py < tall; py++) {
		var lat = (0.5 - py / tall) * Math.PI, cl = Math.cos(lat), sy = Math.sin(lat);
		for (var px = 0; px < wide; px++) {
			var lon = px / wide * Math.PI * 2;
			var rgba = paint(cl * Math.cos(lon), sy, cl * Math.sin(lon), lat);
			var i = (py * wide + px) * 4;
			d[i] = rgba[0]; d[i + 1] = rgba[1]; d[i + 2] = rgba[2]; d[i + 3] = rgba[3];
		}
	}
	c.putImageData(image, 0, 0);
	return new THREE.CanvasTexture(canvas);
}

var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);
document.body.insertBefore(renderer.domElement, document.body.firstChild);
var scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1826, 0.011);
var camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1500);
camera.position.set(0, 5.05, 18.6);
camera.lookAt(0, 3.89, 0);
scene.add(camera);
var ambient = new THREE.AmbientLight(0x9fbfe0, 0.6);
scene.add(ambient);
var sun = new THREE.DirectionalLight(0xfff2e0, 1.5);
sun.position.set(-8, 9, 14);
camera.add(sun);
camera.add(sun.target);
sun.target.position.set(4, 2, -10);
var fire = new THREE.PointLight(0xff5a14, 0, 400);
fire.position.set(0, 6, -150);
scene.add(fire);

var storm = { top: new THREE.Color(0x03070f), low: new THREE.Color(0x14283c) };
var dusk = { top: new THREE.Color(0x4a0612), low: new THREE.Color(0xff4a1c) };
var tones = { top: new THREE.Color(), low: new THREE.Color() };
var sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
	uniforms: { uTop: { value: tones.top }, uLow: { value: tones.low }, uFlash: { value: 0 }, uTime: { value: 0 } },
	vertexShader: 'varying vec3 vDir; void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
	fragmentShader: [
		'uniform vec3 uTop; uniform vec3 uLow; uniform float uFlash; uniform float uTime; varying vec3 vDir;',
		'float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
		'float n(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }',
		'void main() {',
		'  float up = clamp(vDir.y, 0.0, 1.0);',
		'  vec3 c = mix(uLow, uTop, pow(up, 0.42));',
		'  vec2 p = vDir.xz / (vDir.y + 0.25) * 2.2 + vec2(uTime * 0.03, 0.0);',
		'  float cloud = smoothstep(0.45, 0.9, n(p) * 0.6 + n(p * 2.3) * 0.3 + n(p * 5.1) * 0.1) * smoothstep(0.0, 0.25, vDir.y);',
		'  c = mix(c, mix(uLow, vec3(0.02, 0.03, 0.05), 0.55) + uFlash * 0.7, cloud * 0.75);',
		'  gl_FragColor = vec4(c + uFlash * 0.12, 1.0);',
		'}'
	].join('\n') }));
scene.add(sky);

var lamps = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
var tints = [new THREE.Color(0xff2d95), new THREE.Color(0x29e0ff), new THREE.Color(0xffe329), new THREE.Color(0x7dff3a)];
var waves = [
	'uniform float uTime; uniform float uHigh; uniform float uCut;',
	'varying float vHigh; varying vec3 vAt; varying vec3 vNormal;',
	'void wave(vec2 p, vec2 d, float f, float a, float s, inout float h, inout vec2 g) {',
	'  float ph = dot(d, p) * f + uTime * s;',
	'  h += a * sin(ph);',
	'  g += a * f * d * cos(ph);',
	'}',
	'void main() {',
	'  vec3 p = position;',
	'  float h = 0.0; vec2 g = vec2(0.0);',
	'  wave(p.xy, vec2(0.8, 0.6), 0.16, 0.62, 0.9, h, g);',
	'  wave(p.xy, vec2(-0.5, 0.86), 0.24, 0.38, 1.2, h, g);',
	'  wave(p.xy, vec2(0.3, -0.95), 0.43, 0.2, 1.7, h, g);',
	'  wave(p.xy, vec2(0.96, 0.25), 0.82, 0.09, 2.3, h, g);',
	'  wave(p.xy, vec2(-0.7, -0.7), 1.5, 0.04, 3.1, h, g);',
	'  float calm = mix(0.12, 1.0, smoothstep(0.0, 14.0, uCut + p.y));',
	'  h *= calm; g *= calm;',
	'  p.z += h * uHigh;',
	'  vHigh = h;',
	'  vec3 n = normalize(vec3(-g.x * uHigh, -g.y * uHigh, 1.0));',
	'  vNormal = vec3(n.x, n.z, -n.y);',
	'  vAt = (modelMatrix * vec4(p, 1.0)).xyz;',
	'  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);',
	'}'
].join('\n');
var water = [
	'uniform vec3 uDeep; uniform vec3 uTop; uniform vec3 uSkyTop; uniform vec3 uSkyLow; uniform vec3 uSun;',
	'uniform float uSeen; uniform float uFlash; uniform float uTime; uniform float uParty; uniform float uBeat;',
	'uniform vec3 uLamp[4]; uniform vec3 uTint[4]; uniform float uCut;',
	'varying float vHigh; varying vec3 vAt; varying vec3 vNormal;',
	'void main() {',
	'  vec3 n = normalize(vNormal + vec3(sin(vAt.x * 2.1 + uTime * 1.9) * 0.07 + sin(vAt.z * 5.3 - uTime * 2.6) * 0.035, 0.0, cos(vAt.z * 2.4 - uTime * 1.6) * 0.07 + cos(vAt.x * 4.7 + uTime * 2.2) * 0.035));',
	'  vec3 v = normalize(cameraPosition - vAt);',
	'  float fres = pow(1.0 - max(dot(n, v), 0.0), 4.0);',
	'  vec3 r = reflect(-v, n);',
	'  vec3 mirror = mix(uSkyLow, uSkyTop, pow(clamp(r.y, 0.0, 1.0), 0.5));',
	'  vec3 c = mix(uDeep, uTop, clamp(vHigh * 0.42 + 0.42, 0.0, 1.0));',
	'  c = mix(c, mirror, 0.18 + fres * 0.72);',
	'  c += pow(max(dot(r, normalize(uSun)), 0.0), 320.0) * vec3(1.0, 0.92, 0.8) * 0.8;',
	'  c += smoothstep(0.62, 1.15, vHigh + sin(vAt.x * 3.0 + vAt.z * 2.0 + uTime * 2.0) * 0.12) * 0.42;',
	'  for (int i = 0; i < 4; i++) {',
	'    vec3 to = uLamp[i] - vAt;',
	'    float near = 1.0 / (1.0 + dot(to, to) * 0.012);',
	'    c += uTint[i] * near * (0.55 + pow(max(dot(r, normalize(to)), 0.0), 24.0) * 2.5) * uParty * (0.55 + uBeat * 0.9);',
	'  }',
	'  c += uFlash * 0.4;',
	'  float far = clamp(length(vAt.xz - cameraPosition.xz) / 230.0, 0.0, 1.0);',
	'  c = mix(c, uSkyLow, far * far);',
	'  if (vAt.z > uCut) discard;',
	'  gl_FragColor = vec4(c, clamp(uSeen + fres * 0.3, 0.0, 1.0));',
	'}'
].join('\n');

function sea(deep, top, seen) {
	var material = new THREE.ShaderMaterial({ vertexShader: waves, fragmentShader: water, transparent: true, depthWrite: seen > 0.8,
		uniforms: { uTime: { value: 0 }, uHigh: { value: 1 }, uDeep: { value: new THREE.Color(deep) }, uTop: { value: new THREE.Color(top) }, uSeen: { value: seen }, uFlash: { value: 0 },

}

function drops(n, spread, tall, color, size, coloured) {
	var at = new Float32Array(n * 3), hue = new Float32Array(n * 3), c = new THREE.Color();
	for (var i = 0; i < n; i++) {
		at[i * 3] = (Math.random() - 0.5) * spread;
		at[i * 3 + 1] = Math.random() * tall;
		at[i * 3 + 2] = (Math.random() - 0.5) * spread;
		c.setHSL(Math.random(), 1, 0.6);
		hue[i * 3] = c.r; hue[i * 3 + 1] = c.g; hue[i * 3 + 2] = c.b;
	}
	var geometry = new THREE.BufferGeometry();
	geometry.setAttribute('position', new THREE.BufferAttribute(at, 3));
	geometry.setAttribute('color', new THREE.BufferAttribute(hue, 3));
	var points = new THREE.Points(geometry, new THREE.PointsMaterial({ color: color, size: size, transparent: true, opacity: 0.7, depthWrite: false, vertexColors: !!coloured }));
	scene.add(points);
	return points;
}

var ball = new THREE.Group(), glints;
(function () {
	var BALL = 2, sides = [];

		var face = document.createElement('canvas');

	aura.scale.setScalar(BALL * 5);
	ball.add(aura);
	var dots = new Float32Array(420 * 3), hues = new Float32Array(420 * 3);
	for (var d = 0; d < 420; d++) {

		trunk.position.y = tall * 0.75;
		group.add(trunk);
		for (var n = 0; n < 6; n++) {
			var wide = (1 - n / 7) * tall * 0.42, cone = new THREE.Mesh(new THREE.ConeGeometry(wide, tall * 0.42, 9, 1), new THREE.MeshStandardMaterial({ color: leaf.clone().offsetHSL(0, 0, (rnd(n + 9) - 0.5) * 0.05 - 0.04), roughness: 0.95, flatShading: true }));
			cone.position.y = tall * 0.45 + n * tall * 0.2;
			cone.rotation.y = rnd(n + 20) * 6;
			group.add(cone);
		}
		return group;
	}
	var stem = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.42, tall, 8), bark);
	stem.position.y = tall / 2;
	group.add(stem);
	for (var b = 0; b < 3; b++) {
		var limb = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.14, tall * 0.45, 5), bark);
		limb.position.set(Math.cos(b * 2.1 + seed) * tall * 0.13, tall * 0.8, Math.sin(b * 2.1 + seed) * tall * 0.13);
		limb.rotation.set(Math.sin(b * 2.1 + seed) * 0.7, 0, -Math.cos(b * 2.1 + seed) * 0.7);
		group.add(limb);
	}
	for (var k = 0; k < 7; k++) {
		var size = tall * (0.2 + rnd(k + 30) * 0.16), crown = new THREE.Mesh(lump(size, 2, seed + k * 3.7, 0.82), new THREE.MeshStandardMaterial({ color: leaf.clone().offsetHSL((rnd(k + 40) - 0.5) * 0.03, 0, (rnd(k + 50) - 0.5) * 0.09), roughness: 0.9 }));
		var turn = rnd(k + 60) * 6.283, out = k ? tall * (0.16 + rnd(k + 70) * 0.16) : 0;
		crown.position.set(Math.cos(turn) * out, tall * (0.92 + rnd(k + 80) * 0.3) + (k ? 0 : tall * 0.12), Math.sin(turn) * out);
		group.add(crown);
	}
	return group;
}

function woods() {
	grove = new THREE.Scene();
	grove.fog = new THREE.Fog(0xbfe0f8, 70, 300);
	lens = new THREE.PerspectiveCamera(56, innerWidth / innerHeight, 0.1, 900);
	lens.position.set(0, 1.7, 0);
	grove.add(new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
		vertexShader: 'varying vec3 p; void main() { p = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
		fragmentShader: 'varying vec3 p; void main() { float h = clamp(normalize(p).y, 0.0, 1.0); gl_FragColor = vec4(mix(vec3(0.80, 0.91, 0.99), vec3(0.13, 0.45, 0.88), pow(h, 0.5)), 1.0); }' })));
	grove.add(new THREE.HemisphereLight(0xd6ecff, 0x4f7d3c, 1.25));
	var sun = new THREE.DirectionalLight(0xfff1d2, 2.4);
	sun.position.set(-70, 110, 50);
	grove.add(sun);
	var land = new THREE.PlaneGeometry(700, 700, 140, 140);
	land.rotateX(-Math.PI / 2);
	var at = land.attributes.position, hue = new Float32Array(at.count * 3), shade = new THREE.Color();
	for (var i = 0; i < at.count; i++) {
		var x = at.getX(i), z = at.getZ(i), mix = Math.sin(x * 0.31) * Math.sin(z * 0.27) * 0.5 + Math.sin(x * 0.07 + z * 0.05) * 0.5;
		at.setY(i, knoll(x, z));
		shade.setHSL(0.27 + mix * 0.025, 0.55, 0.3 + mix * 0.05);
		hue[i * 3] = shade.r; hue[i * 3 + 1] = shade.g; hue[i * 3 + 2] = shade.b;
	}
	land.setAttribute('color', new THREE.BufferAttribute(hue, 3));
	land.computeVertexNormals();
	grove.add(new THREE.Mesh(land, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 })));
	for (var n = 0; n < 150; n++) {
		var v = Math.sin(n * 91.7) * 43758.5453, w = Math.sin(n * 47.3 + 5) * 43758.5453, turn = (v - Math.floor(v)) * 6.283, far = 24 + Math.pow(w - Math.floor(w), 0.7) * 230;
		var px = Math.cos(turn) * far, pz = Math.sin(turn) * far - 6;
		if (Math.abs(px) < 11 && pz < 4 && pz > -70) continue;
		var one = oak(n + 1);
		one.position.set(px, knoll(px, pz) - 0.2, pz);
		one.rotation.y = n * 1.7;
		one.scale.setScalar(0.85 + (w - Math.floor(w)) * 0.7);
		grove.add(one);
	}
	var cloud = new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false, transparent: true, opacity: 0.92 });
	for (var c = 0; c < 9; c++) {
		var puff = new THREE.Group();
		for (var p = 0; p < 6; p++) {
			var ball = new THREE.Mesh(lump(9 + (p % 3) * 4, 2, c * 5 + p, 0.6), cloud);
			ball.position.set((p - 2.5) * 11, Math.sin(p * 2.2 + c) * 3, Math.cos(p * 1.3 + c) * 6);
			puff.add(ball);
		}
		puff.position.set(Math.cos(c * 0.9 + 0.4) * (170 + c * 22), 95 + (c % 4) * 16, Math.sin(c * 0.9 + 0.4) * (170 + c * 22) - 60);
		puff.userData.drift = 0.6 + (c % 3) * 0.3;
		puff.name = 'cloud';
		grove.add(puff);
	}
	reel = document.createElement('video');
	reel.src = new URL('forest.mp4', location.href).href;
	reel.preload = 'auto';
	reel.playsInline = true;
	reel.addEventListener('ended', function () { setTimeout(close, 900); });
	reel.addEventListener('error', function () { log('forest video failed'); setTimeout(close, 6000); });
	var film = new THREE.VideoTexture(reel);
	film.colorSpace = THREE.SRGBColorSpace;
	var sign = new THREE.Group(), steel = new THREE.MeshStandardMaterial({ color: 0x3a3f46, roughness: 0.5, metalness: 0.7 });
	[-1.9, 1.9].forEach(function (x) {
		var leg = new THREE.Mesh(new THREE.BoxGeometry(0.22, 2.6, 0.22), steel);
		leg.position.set(x, 1.3, 0);
		sign.add(leg);
	});
	var cabinet = new THREE.Mesh(new THREE.BoxGeometry(4.9, 8.3, 0.34), new THREE.MeshStandardMaterial({ color: 0x15171b, roughness: 0.4, metalness: 0.5 }));
	cabinet.position.y = 2.6 + 4.15;
	sign.add(cabinet);
	var face = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 8), new THREE.MeshBasicMaterial({ map: film, toneMapped: false, fog: false }));
	face.position.set(0, 2.6 + 4.15, 0.18);
	sign.add(face);
	sign.position.set(0, knoll(0, -15), -15);
	grove.add(sign);
	whiteout = document.createElement('div');
	whiteout.id = "whiteout";
	whiteout.style.cssText = 'position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50';
	document.body.appendChild(whiteout);
}

function bang() {
	var shades = [0xfff6c2, 0xffd23f, 0xff8f1f, 0xee4b2b, 0x6a6a6a];
	for (var n = 0; n < 22; n++) {
		var puff = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5 + (n % 5) * 0.14, 1), new THREE.MeshBasicMaterial({ color: shades[n % 5], transparent: true, fog: false }));
		puff.material.flatShading = true;
		var turn = n * 2.399, lift = ((n * 7) % 11) / 11 - 0.25;
		puff.userData = { fly: new THREE.Vector3(Math.cos(turn) * (1 - Math.abs(lift)), lift + 0.35, Math.sin(turn) * 0.6).multiplyScalar(3.4 + (n % 4) * 1.3), spin: (n % 2 ? 1 : -1) * (1 + n * 0.13) };
		puff.position.set(0, 1.5, -5);
		grove.add(puff);
		blast.push(puff);
	}
	for (var s = 0; s < 12; s++) {
		var ray = new THREE.Mesh(new THREE.ConeGeometry(0.22, 3.4, 4), new THREE.MeshBasicMaterial({ color: s % 2 ? 0xffe14d : 0xffffff, transparent: true, fog: false }));
		ray.position.set(0, 1.5, -5.2);
		ray.rotation.z = s * Math.PI / 6;
		ray.userData = { ray: true };
		ray.geometry.translate(0, 2.4, 0);
		grove.add(ray);
		blast.push(ray);
	}
	var card = document.createElement('canvas');
	card.width = 512; card.height = 256;
	var pen = card.getContext('2d');
	pen.font = '900 170px Impact, sans-serif';
	pen.textAlign = 'center'; pen.textBaseline = 'middle';
	pen.lineJoin = 'round'; pen.lineWidth = 22; pen.strokeStyle = '#1b1b1b';
	pen.strokeText('BOOM!', 256, 132);
	pen.fillStyle = '#ffe14d';
	pen.fillText('BOOM!', 256, 132);
	shout = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(card), transparent: true, fog: false, depthTest: false }));
	shout.position.set(0, 2.1, -4.4);
	grove.add(shout);
}

function plunge(now) {
	if (mode !== 'flight') return;
	mode = 'plunge';
	crashAt = now;
	song.pause();
	sea.pause();
	woods();
	log('plunge');
}

function glade(now) {
	if (mode === 'plunge') {
		var fall = Math.min(1, (now - crashAt) / 750);
		flight(now);
		renderer.domElement.style.transformOrigin = '50% 78%';
		renderer.domElement.style.transform = 'translateY(' + (fall * fall * 30) + '%) scale(' + (1 + fall * fall * fall * 5) + ') rotate(' + (fall * fall * 16) + 'deg)';
		whiteout.style.opacity = String(Math.max(0, fall - 0.75) * 4);
		if (fall < 1) return;
		mode = 'glade';
		forestAt = now;
		renderer.domElement.style.transform = '';
		renderer.domElement.id = "stage";
		document.body.classList.add('landed');
		renderer.autoClear = true;
		bang();
		log('glade');
	}
	var t = (now - forestAt) / 1000;
	if (lens.aspect !== innerWidth / innerHeight) {
		lens.aspect = innerWidth / innerHeight;
		lens.updateProjectionMatrix();
	}
	whiteout.style.opacity = String(Math.max(0, 1 - t * 1.6));
	blast.forEach(function (bit) {
		var life = Math.min(1, t / 2.2);
		if (bit.userData.ray) {
			bit.scale.setScalar(Math.sin(Math.min(1, t / 0.5) * Math.PI) * 1.6 + 0.001);
			bit.material.opacity = Math.max(0, 1 - t / 0.6);
		} else {
			bit.position.set(bit.userData.fly.x * life * (2 - life), 1.5 + bit.userData.fly.y * life * (2 - life) - life * life * 1.2, -5 + bit.userData.fly.z * life * (2 - life));
			bit.scale.setScalar(0.4 + Math.sin(life * Math.PI * 0.75) * 2.6);
			bit.rotation.z = t * bit.userData.spin;
			bit.material.opacity = Math.max(0, 1 - Math.pow(life, 3));
		}
		bit.visible = t < 2.3;
	});
	if (shout) {
		var pop = Math.min(1, t / 0.18);
		shout.scale.set(5.2 * pop * (1 + Math.sin(t * 30) * 0.03 * Math.max(0, 1 - t)), 2.6 * pop, 1);
		shout.material.opacity = Math.max(0, 1 - Math.max(0, t - 0.9) / 0.5);
		shout.material.rotation = Math.sin(t * 22) * 0.05 * Math.max(0, 1 - t);
	}
	var shake = Math.max(0, 1 - t / 1.4) * 0.22;
	lens.position.set(Math.sin(t * 47) * shake, 1.7 + Math.cos(t * 53) * shake + Math.sin(t * 0.5) * 0.02, -Math.min(4, Math.max(0, t - 2) * 0.5));
	lens.lookAt(Math.sin(t * 0.21) * 0.25, 5.4 + Math.min(1, t / 3) * 0.9, -15);
	grove.children.forEach(function (child) { if (child.name === 'cloud') child.position.x += child.userData.drift * 0.004; });
	if (reel && reel.paused && !reel.ended && t > 1.5 && !reel.dataset.started) {
		reel.dataset.started = '1';
		reel.play().catch(function (e) { log('forest video ' + e); });
	}
	renderer.render(grove, lens);
}

addEventListener('mousemove', function (e) { mouse.x = e.clientX / innerWidth; mouse.y = e.clientY / innerHeight; });
addEventListener("keydown", function (e) {
	if (e.key === "Escape") close();
	if (e.key === "s" && mode === "sea" && born) gag(!gagged);
	keys[e.key] = true;
});
addEventListener("keyup", function (e) { keys[e.key] = false; });
addEventListener('mousedown', function (e) {
	if (!born) return;
	if (mode === "flight") {
		plunge(performance.now());
		return;
	}
	if (mode === "plunge" || mode === "glade") return;
	var since = performance.now() - born;
	finger.set(e.clientX / innerWidth * 2 - 1, 1 - e.clientY / innerHeight * 2);
	aim.setFromCamera(finger, camera);
	if (aim.intersectObject(body).length) {
		if (mode !== "sea") return;
		if (!gagged) {
			gag(true);
			return;
		}
		var clicked = performance.now();
		hurt = Math.min(14, hurt + 1.5);
		jabs = jabs.filter(function (at) { return clicked - at < 1900; });
		jabs.push(clicked);
		planet.scale.setScalar(0.82);
		scream();
		if (jabs.length >= 6) explode(clicked);
		return;
	}
	var caught = aim.intersectObjects(shoal.filter(function (fish) { return fish.alive; }).map(function (fish) { return fish.mesh; }), true)[0];
	if (caught) {
		slay(shoal.filter(function (fish) { var at = caught.object; while (at && at !== fish.mesh) at = at.parent; return !!at; })[0]);
		return;
	}
	var ray = aim.ray;
	if (ray.direction.y < -0.02) {
		var far = (level.highAt - ray.origin.y) / ray.direction.y;
		look.copy(ray.direction).multiplyScalar(far).add(ray.origin);
		look.z = Math.min(look.z, CUT - 1.5);
		ripple(look, since);
	} else {
		look.copy(ray.direction).multiplyScalar(90).add(ray.origin);
		strike(since, look.x, look.z);
	}
	if (Math.random() < 0.5) speak();
});
requestAnimationFrame(frame);
read(function (data) { begin(data || { name: '', desktop: '', audio: '', logs: 0, left: 0, input: 0, write: 0, read: 0, output: 0 }); });
